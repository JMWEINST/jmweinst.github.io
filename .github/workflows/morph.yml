name: Morph (Mac app)

# Builds Morph on a real Mac, runs every conversion it knows, then drives the app on a live
# desktop (click a file, click through the wheel, check the result). Put [dist] in a commit
# message to have the tested build committed to morph/dist, which is what install.sh downloads.

on:
  push:
    branches: ['claude/**', main]
    paths: ['morph/**', '!morph/dist/**', '!morph/ci/shots/**', '.github/workflows/morph.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash morph/build.sh

      - name: Every conversion, on generated samples
        run: morph/build/Morph.app/Contents/MacOS/Morph --selftest

      - name: The real thing, on a live desktop
        run: bash morph/ci/e2e.sh

      - name: The installer, start to finish
        run: |
          MORPH_URL="file://$PWD/morph/build/Morph.zip" bash morph/install.sh
          test -x /Applications/Morph.app/Contents/MacOS/Morph
          sleep 4
          pgrep -x Morph
          screencapture -x /tmp/morph-shot.png && sips -s format jpeg -s formatOptions 70 /tmp/morph-shot.png --out /tmp/morph-shots/installed.jpg >/dev/null
          pkill -x Morph || true

      - name: Keep the build and screenshots with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morph-${{ matrix.os }}
          path: |
            morph/build/Morph.zip
            /tmp/morph-shots
          if-no-files-found: ignore

      - name: Commit the tested build
        if: always() && matrix.os == 'macos-15'
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          OUTCOME: ${{ job.status }}
        run: |
          changed=0
          if [[ "$MESSAGE" == *"[shots]"* ]] && ls /tmp/morph-shots/*.jpg >/dev/null 2>&1; then
            mkdir -p morph/ci/shots && cp /tmp/morph-shots/*.jpg morph/ci/shots/ && git add morph/ci/shots && changed=1
          fi
          if [[ "$MESSAGE" == *"[dist]"* && "$OUTCOME" == "success" ]]; then
            mkdir -p morph/dist && cp morph/build/Morph.zip morph/dist/Morph.zip && git add morph/dist && changed=1
          fi
          [ "$changed" = 1 ] || exit 0
          git fetch -q origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then echo "The branch has moved on; a newer run will publish."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Morph: tested build from $(git rev-parse --short HEAD)" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
