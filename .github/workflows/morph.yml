name: Morph (Mac app)

on:
  push:
    branches: ['claude/**', main]
    paths: ['morph/**', '.github/workflows/morph.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe the runner
        run: bash morph/ci/probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: /tmp/desk.jpg
          if-no-files-found: ignore
